
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Arena | Student Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #070914;
            --panel: #101425;
            --border: rgba(255,255,255,0.09);
            --text: #f7f8ff;
            --muted: #8d96ad;
            --primary: #765cff;
            --primary2: #9b82ff;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: var(--text);

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(118,92,255,0.22),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(45,212,160,0.08),
                    transparent 25%
                ),
                var(--bg);

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 470px;

            padding: 42px;

            border: 1px solid var(--border);
            border-radius: 28px;

            background: rgba(16,20,37,0.9);

            backdrop-filter: blur(24px);

            box-shadow:
                0 35px 100px rgba(0,0,0,0.45);
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            border-radius: 21px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 29px;
            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary2)
                );

            box-shadow:
                0 15px 40px rgba(118,92,255,0.3);
        }

        h1 {
            text-align: center;
            font-size: 31px;
        }

        .sub {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin-top: 8px;
        }

        .form {
            margin-top: 30px;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;

            font-size: 11px;
            font-weight: 850;

            color: #cfd4e2;
        }

        input,
        select {
            width: 100%;
            height: 51px;

            padding: 0 15px;

            border: 1px solid var(--border);
            outline: none;

            border-radius: 12px;

            color: white;

            background: rgba(5,8,18,0.75);
        }

        input:focus,
        select:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 4px rgba(118,92,255,0.1);
        }

        select option {
            background: #101425;
        }

        button {
            width: 100%;
            height: 52px;

            border: 0;
            border-radius: 12px;

            color: #fff;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #8d70ff
                );

            font-weight: 900;

            cursor: pointer;

            margin-top: 4px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            display: none;

            margin-top: 15px;
            padding: 12px;

            border-radius: 10px;

            color: #ff9aa9;

            background: rgba(255,93,115,0.08);

            border: 1px solid rgba(255,93,115,0.2);

            font-size: 12px;
            font-weight: 700;
        }

        .link {
            text-align: center;

            margin-top: 21px;

            color: var(--muted);

            font-size: 12px;
        }

        .link a {
            color: #bdb2ff;

            text-decoration: none;

            font-weight: 800;
        }

        @media(max-width:560px) {

            .card {
                padding: 30px 21px;
            }

        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        Q
    </div>

    <h1>
        Welcome Back
    </h1>

    <p class="sub">
        Login with your roll number and year
    </p>


    <div class="error" id="error"></div>


    <div class="form">

        <div class="field">

            <label>
                ROLL NUMBER
            </label>

            <input
                id="rollNo"
                placeholder="Example: 24A31A04O1"
                autocomplete="off"
            >

        </div>


        <div class="field">

            <label>
                YEAR
            </label>

            <select id="year">

                <option value="">
                    Select year
                </option>

                <option value="1">
                    1st Year
                </option>

                <option value="2">
                    2nd Year
                </option>

                <option value="3">
                    3rd Year
                </option>

                <option value="4">
                    4th Year
                </option>

            </select>

        </div>


        <button id="loginBtn">
            LOGIN →
        </button>

    </div>


    <div class="link">

        New student?

        <a href="/student/register">
            Create your student profile
        </a>

    </div>

</div>


<script>

const errorBox =
    document.getElementById("error");


function showError(message) {

    errorBox.textContent = message;

    errorBox.style.display = "block";

}


function clearError() {

    errorBox.style.display = "none";

    errorBox.textContent = "";

}


document
.getElementById("loginBtn")
.addEventListener("click", async () => {

    clearError();


    const roll_no =
        document
        .getElementById("rollNo")
        .value
        .trim();


    const year =
        document
        .getElementById("year")
        .value;


    const button =
        document.getElementById("loginBtn");


    if (!roll_no || !year) {

        showError(
            "Enter your roll number and year."
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "LOGGING IN...";


    try {

        const response =
            await fetch(
                "/api/student/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            roll_no: roll_no,
                            year: year
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Login failed."
            );

        }


        window.location.href =
            "/student/dashboard";


    } catch (error) {

        showError(error.message);

    } finally {

        button.disabled = false;

        button.textContent =
            "LOGIN →";

    }

});

</script>

</body>
</html>
