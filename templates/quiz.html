<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quiz Arena | Quiz</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {

            --bg: #070914;
            --panel: #101425;
            --border: rgba(255,255,255,0.08);

            --text: #f7f8ff;
            --muted: #8d96ad;

            --primary: #765cff;
            --primary2: #9b82ff;

            --green: #2dd4a0;
            --red: #ff5d73;

        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                sans-serif;

            color:
                var(--text);

            background:

                radial-gradient(
                    circle at 10% 10%,
                    rgba(118,92,255,0.20),
                    transparent 28%
                ),

                var(--bg);

        }


        /* =====================================================
           MAIN PAGE
        ===================================================== */

        .page {

            max-width:
                1150px;

            margin:
                auto;

            padding:
                18px;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                15px;

            padding:
                18px 20px;

            border:
                1px solid var(--border);

            border-radius:
                17px;

            background:
                rgba(16,20,37,0.90);

            backdrop-filter:
                blur(20px);

        }


        .title {

            font-size:
                19px;

            font-weight:
                900;

        }


        .details {

            margin-top:
                5px;

            color:
                var(--muted);

            font-size:
                10px;

        }


        .timer {

            min-width:
                105px;

            padding:
                12px 15px;

            border-radius:
                10px;

            text-align:
                center;

            color:
                #bfb3ff;

            background:
                rgba(118,92,255,0.12);

            font-size:
                19px;

            font-weight:
                900;

        }


        .timer.danger {

            color:
                white;

            background:
                rgba(255,93,115,0.90);

            animation:
                pulse 0.8s infinite;

        }


        @keyframes pulse {

            50% {

                transform:
                    scale(1.04);

            }

        }


        /* =====================================================
           PROGRESS
        ===================================================== */

        .progress {

            margin:
                15px 0;

            padding:
                15px 18px;

            border:
                1px solid var(--border);

            border-radius:
                14px;

            background:
                rgba(16,20,37,0.85);

        }


        .progress-info {

            display:
                flex;

            justify-content:
                space-between;

            margin-bottom:
                8px;

            color:
                var(--muted);

            font-size:
                10px;

            font-weight:
                850;

        }


        .bar {

            height:
                7px;

            overflow:
                hidden;

            border-radius:
                10px;

            background:
                rgba(255,255,255,0.07);

        }


        .fill {

            height:
                100%;

            width:
                0%;

            background:
                linear-gradient(
                    90deg,
                    var(--primary),
                    var(--primary2)
                );

            transition:
                width 0.25s;

        }


        /* =====================================================
           QUESTION CARD
        ===================================================== */

        .card {

            padding:
                34px;

            border:
                1px solid var(--border);

            border-radius:
                21px;

            background:
                rgba(16,20,37,0.92);

            box-shadow:
                0 25px 70px rgba(0,0,0,0.25);

        }


        .top {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom:
                24px;

        }


        .number {

            padding:
                8px 12px;

            border-radius:
                9px;

            color:
                #bdb2ff;

            background:
                rgba(118,92,255,0.12);

            font-size:
                10px;

            font-weight:
                900;

        }


        .question-timer {

            color:
                var(--muted);

            font-size:
                11px;

            font-weight:
                850;

        }


        .question-timer.danger {

            color:
                var(--red);

        }


        .question {

            margin-bottom:
                27px;

            font-size:
                23px;

            line-height:
                1.55;

            font-weight:
                800;

        }


        /* =====================================================
           OPTIONS
        ===================================================== */

        .options {

            display:
                grid;

            gap:
                12px;

        }


        .option {

            position:
                relative;

        }


        .option input {

            position:
                absolute;

            opacity:
                0;

        }


        .option label {

            display:
                block;

            padding:
                17px;

            border:
                1px solid var(--border);

            border-radius:
                12px;

            color:
                #ccd1df;

            background:
                rgba(255,255,255,0.025);

            cursor:
                pointer;

            transition:
                0.2s;

        }


        .option label:hover {

            border-color:
                rgba(118,92,255,0.45);

            background:
                rgba(118,92,255,0.05);

        }


        .option input:checked + label {

            border-color:
                var(--primary);

            color:
                white;

            background:
                rgba(118,92,255,0.12);

            box-shadow:
                0 0 0 2px
                rgba(118,92,255,0.08);

        }


        .letter {

            display:
                inline-flex;

            width:
                29px;

            height:
                29px;

            align-items:
                center;

            justify-content:
                center;

            margin-right:
                10px;

            border-radius:
                8px;

            color:
                #bdb2ff;

            background:
                rgba(118,92,255,0.11);

            font-size:
                10px;

            font-weight:
                900;

        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .nav {

            display:
                flex;

            justify-content:
                flex-end;

            margin-top:
                26px;

            padding-top:
                21px;

            border-top:
                1px solid var(--border);

        }


        button {

            min-width:
                120px;

            height:
                45px;

            padding:
                0 20px;

            border:
                0;

            border-radius:
                10px;

            color:
                white;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #8d70ff
                );

            cursor:
                pointer;

            font-size:
                11px;

            font-weight:
                900;

        }


        button:disabled {

            opacity:
                0.5;

            cursor:
                not-allowed;

        }


        .submit {

            background:
                linear-gradient(
                    135deg,
                    #059669,
                    #10b981
                );

        }


        /* =====================================================
           COMPLETION SCREEN
        ===================================================== */

        .completion-screen {

            position:
                fixed;

            inset:
                0;

            z-index:
                300000;

            display:
                none;

            align-items:
                center;

            justify-content:
                center;

            padding:
                24px;

            text-align:
                center;

            background:

                radial-gradient(
                    circle at 20% 20%,
                    rgba(118,92,255,0.24),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(45,212,160,0.14),
                    transparent 30%
                ),

                #070914;

        }


        .completion-screen.active {

            display:
                flex;

        }


        .completion-card {

            width:
                100%;

            max-width:
                540px;

            padding:
                48px 42px;

            border:
                1px solid
                rgba(255,255,255,0.10);

            border-radius:
                30px;

            background:
                rgba(16,20,37,0.95);

            backdrop-filter:
                blur(25px);

            box-shadow:
                0 40px 120px
                rgba(0,0,0,0.55);

        }


        .success-icon {

            width:
                88px;

            height:
                88px;

            margin:
                0 auto 22px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            border-radius:
                50%;

            color:
                white;

            background:
                linear-gradient(
                    135deg,
                    #20c997,
                    #2dd4a0
                );

            font-size:
                43px;

            font-weight:
                900;

        }


        .completion-badge {

            display:
                inline-block;

            padding:
                7px 13px;

            margin-bottom:
                15px;

            border-radius:
                999px;

            color:
                #7ee7c5;

            background:
                rgba(45,212,160,0.09);

            font-size:
                10px;

            font-weight:
                900;

        }


        .completion-card h1 {

            font-size:
                34px;

            font-weight:
                900;

        }


        .completion-message {

            margin-top:
                12px;

            color:
                #e8eaff;

            font-size:
                17px;

            font-weight:
                700;

        }


        .completion-sub {

            max-width:
                390px;

            margin:
                10px auto 0;

            color:
                #8d96ad;

            font-size:
                13px;

            line-height:
                1.7;

        }


        .completion-line {

            width:
                100%;

            height:
                1px;

            margin:
                28px 0;

            background:
                rgba(255,255,255,0.08);

        }


        .completion-info {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                12px;

            margin-bottom:
                24px;

        }


        .completion-info div {

            padding:
                14px;

            border-radius:
                13px;

            background:
                rgba(255,255,255,0.035);

        }


        .completion-info span {

            display:
                block;

            margin-bottom:
                5px;

            color:
                #737c93;

            font-size:
                10px;

            font-weight:
                800;

        }


        .completion-info strong {

            font-size:
                13px;

        }


        .dashboard-btn {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            width:
                100%;

            height:
                51px;

            border-radius:
                12px;

            color:
                white;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #967cff
                );

            text-decoration:
                none;

            font-size:
                12px;

            font-weight:
                900;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media(max-width:700px) {

            .page {
                padding:
                    10px;
            }


            .header {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .timer {
                width:
                    100%;
            }


            .card {
                padding:
                    22px 17px;
            }


            .question {
                font-size:
                    19px;
            }


            .nav {
                flex-direction:
                    column;
            }


            button {
                width:
                    100%;
            }


            .quiz-start-card {
                padding:
                    35px 22px;
            }


            .quiz-start-card h1 {
                font-size:
                    27px;
            }


            .completion-card {
                padding:
                    38px 24px;
            }


            .completion-card h1 {
                font-size:
                    28px;
            }


            .completion-info {
                grid-template-columns:
                    1fr;
            }

        }

        /* Old header/progress are not used visually. */
        .header,
        .progress {
            display: none !important;
        }

        /* =====================================================
           TIMER - ALWAYS VISIBLE
           ===================================================== */

        #timer {
            display: flex !important;
            visibility: visible !important;
            opacity: 1 !important;

            position: fixed !important;
            z-index: 99999 !important;

            top: 28px !important;
            right: 32px !important;

            width: 145px !important;
            height: 50px !important;
            min-width: 145px !important;

            align-items: center;
            justify-content: center;

            margin: 0 !important;
            padding: 0 !important;

            border: 1px solid #00cfff !important;
            border-radius: 5px !important;

            background: rgba(2, 14, 32, .96) !important;

            color: #62eaff !important;

            font-size: 20px !important;
            font-weight: 700 !important;
            letter-spacing: 1px;

            text-shadow: none !important;

            box-shadow:
                0 0 10px rgba(0,190,255,.45),
                inset 0 0 12px rgba(0,110,255,.10) !important;
        }

        #timer.danger {
            color: #ffffff !important;
            background: rgba(2, 22, 45, .98) !important;
            animation: none !important;
        }

        /* =====================================================
           QUESTION BOX
           Moved upward and made taller.
           ===================================================== */

        .card {
            position: absolute;
            z-index: 10;

            left: 16.5%;
            top: 27%;
            width: 59%;
            height: 57%;

            margin: 0;
            padding: 0;

            border: 2px solid #00c8ff;
            border-radius: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(3, 17, 40, .985),
                    rgba(3, 14, 33, .985)
                );

            box-shadow:
                0 0 7px rgba(0,190,255,.75),
                0 0 22px rgba(0,120,255,.28);

            clip-path: polygon(
                0 5%,
                3.5% 0,
                96.5% 0,
                100% 5%,
                100% 95%,
                96.5% 100%,
                3.5% 100%,
                0 95%
            );

            overflow: visible;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 7px;

            border: 1px solid rgba(0,190,255,.45);

            box-shadow: none;

            clip-path: inherit;
            pointer-events: none;
        }

        .top {
            display: none !important;
        }

        /* =====================================================
           QUESTION - NORMAL FLAT TEXT
           ===================================================== */

        .question {
            position: absolute;

            left: 8.5%;
            top: 9%;

            width: 83%;
            min-height: 55%;

            margin: 0;
            padding: 0;

            color: #f5f8ff;

            font-size: clamp(19px, 2.05vw, 34px);
            line-height: 1.52;

            font-weight: 700;
            letter-spacing: 0;

            text-align: left;

            z-index: 20;

            overflow: visible;

            /* NO 3D EFFECT */
            text-shadow: none !important;
            filter: none !important;
        }

        .question::before {
            content: "Q" attr(data-question-number) ".";

            display: inline-block;

            margin-right: 2.5%;

            color: #00dfff;

            font-size: .96em;
            font-weight: 800;

            vertical-align: baseline;

            /* Simple neon, not 3D */
            text-shadow: 0 0 7px rgba(0,210,255,.45);
        }

        #questionNumber {
            display: none !important;
        }

        /* =====================================================
           OPTIONS - MOVE UP INSIDE THE BOX
           ===================================================== */

        .options {
            position: absolute;

            left: 8.5%;
            top: 61%;

            width: 83%;

            margin: 0;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 11px;

            z-index: 30;
        }

        .option label {
            min-height: 48px;

            padding: 12px 15px;

            border: 1px solid rgba(0,190,255,.52);
            border-radius: 4px;

            color: #dff4ff;

            background: rgba(3, 22, 48, .90);

            box-shadow: none;

            font-size: 14px;
            font-weight: 600;

            /* Normal text */
            text-shadow: none !important;

<body>


<!-- =====================================================

            <div
                class="title"
                id="quizTitle">

            </div>

            </div>

</header>

            </span>

            </span>

                class="fill"
                id="progressFill">
            </div>

        </div>

        </div>

            <!--
                NO PREVIOUS BUTTON.

            -->

                class="next"

<!-- =====================================================
     COMPLETION
===================================================== -->

<div
    class="completion-screen"
    id="completionScreen">

        </div>

        </div>

        </h1>

            class="completion-message"
            id="completionMessage">

            Thank you for participating.

        </p>


        <p
            class="completion-sub"
            id="completionSub">

            Your answers have been submitted successfully.
            Your response has been securely saved.

        </p>


        <div class="completion-line">
        </div>


        <div class="completion-info">


            <div>

                <span>
                    Status
                </span>

                <strong>
                    Completed
                </strong>

                </span>

            class="dashboard-btn">

            BACK TO DASHBOARD

        </a>

<script>


/* =====================================================
   QUIZ ID
===================================================== */

const quizId =
    "{{ quiz_id }}";


/* =====================================================
   VARIABLES
===================================================== */

let quiz = null;

let questions = [];

let current = 0;

let answers = {};

let timer = null;

let remaining = 0;

let started = false;

let submitting = false;

let tabSwitchSubmitted = false;
let quizFinished = false;
let pageIsBeingReloaded = false;
let tabSwitchTimer = null;

// Total quiz duration tracking.
// This is the only time value saved to the database.
let quizStartTime = null;
let totalTimeTaken = 0;


/* =====================================================
   SHORTCUT
===================================================== */

const $ = id =>
    document.getElementById(id);


/* =====================================================
   API
===================================================== */

async function api(
    url,
    options = {}
) {


    const response =
        await fetch(
            url,
            options
        );


    let data;


    try {

        data =
            await response.json();

    }
    catch {

        throw new Error(
            "Invalid server response."
        );

    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            data.message ||
            "Request failed."
        );

    }


    return data;

}


/* =====================================================
   SHUFFLE QUESTIONS ONLY
===================================================== */

function shuffleQuestions(array) {


    /*
        Fisher-Yates shuffle.

        Only the question array is shuffled.

        Each question object keeps its own:
            id
            question_text
            option_a
            option_b
            option_c
            option_d
            correct_answer
            question_order
            time_limit

        Therefore scoring remains correct.

        Options remain A, B, C, D.
    */


    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {


        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* =====================================================
   LOAD QUIZ
===================================================== */

async function init() {


    try {


        /*
            Get logged-in student.
        */

        const studentData =
            await api(
                "/api/student/me"
            );


        const student =
            studentData.student;


        $("studentDetails")
            .textContent =
            `${student.roll_no} • ${student.name} • Section ${student.section} • Year ${student.year}`;


        /*
            Get quiz.
        */

        const data =
            await api(
                "/api/student/quiz/"
                + quizId
            );


        quiz =
            data.quiz;


        questions =
            data.questions || [];


        /*
            =================================================
            IMPORTANT
            =================================================

            Shuffle QUESTIONS only.

            Options are NOT shuffled.
        */

        shuffleQuestions(
            questions
        );


        $("quizTitle")
            .textContent =
            quiz.title;


        if (
            !questions.length
        ) {


            alert(
                "This quiz has no questions."
            );


            location.href =
                "/student/dashboard";


            return;

        }


        // Quiz starts automatically after the questions are loaded.
        started = true;
        submitting = false;
        quizStartTime = Date.now();
        totalTimeTaken = 0;
        showQuestion();


    }
    catch (error) {


        console.error(
            "QUIZ INIT ERROR:",
            error
        );


        alert(
            error.message
        );


        location.href =
            "/student/dashboard";

    }

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {


    const question =
        questions[current];


    if (!question) {

        return;

    }


    /*
        Question number.
    */

    $("questionNumber")
        .textContent =
        `QUESTION ${current + 1}`;


    /*
        Progress.
    */

    $("progressText")
        .textContent =
        `Question ${current + 1} of ${questions.length}`;


    updateAnswered();


    $("progressFill")
        .style.width =
        (
            (
                current + 1
            )
            /
            questions.length
            *
            100
        )
        + "%";


    /*
        Question text.
    */

    $("questionText")
        .textContent =
        question.question_text;


    /*
        =================================================
        OPTIONS ARE NOT SHUFFLED
        =================================================

        Always:

        A → option_a
        B → option_b
        C → option_c
        D → option_d
    */

    const options = [

        [
            "A",
            question.option_a
        ],

        [
            "B",
            question.option_b
        ],

        [
            "C",
            question.option_c
        ],

        [
            "D",
            question.option_d
        ]

    ];


    $("options").innerHTML =

        options
            .map(
                (
                    [
                        letter,
                        text
                    ]
                ) => `

                    <div class="option">


                        <input

                            type="radio"

                            name="answer"

                            id="answer-${letter}"

                            value="${letter}"

                            ${
                                answers[
                                    question.id
                                ] === letter
                                    ? "checked"
                                    : ""
                            }

                        >


                        <label
                            for="answer-${letter}"
                        >


                            <span
                                class="letter"
                            >

                                ${letter}

                            </span>


                            ${escapeHTML(text)}


                        </label>


                    </div>

                `
            )
            .join("");


    /*
        Save selected answer.
    */

    document
        .querySelectorAll(
            'input[name="answer"]'
        )
        .forEach(
            input => {


                input.addEventListener(
                    "change",
                    () => {


                        answers[
                            question.id
                        ] =
                            input.value;


                        updateAnswered();

                    }
                );

            }
        );


    /*
        Last question:
        Submit button.

        Other questions:
        Next button.
    */

    if (
        current ===
        questions.length - 1
    ) {


        $("next")
            .textContent =
            "SUBMIT QUIZ ✓";


        $("next")
            .className =
            "submit";

    }
    else {


        $("next")
            .textContent =
            "Next →";


        $("next")
            .className =
            "next";

    }


    /*
        Start NEW timer.
    */

    startTimer(
        Number(
            question.time_limit || 30
        )
    );

}


/* =====================================================
   ANSWER COUNT
===================================================== */

function updateAnswered() {


    $("answeredText")
        .textContent =
        `${Object.keys(answers).length} answered`;

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(
    seconds
) {


    clearInterval(
        timer
    );


    remaining =
        Math.max(
            1,
            Number(seconds) || 30
        );


    updateTimer();


    timer =
        setInterval(
            () => {


                remaining--;


                updateTimer();


                if (
                    remaining <= 0
                ) {


                    clearInterval(
                        timer
                    );


                    /*
                        Intermediate question:
                        timer ends → next question.

                        Last question:
                        timer ends → submit.
                    */

                    if (
                        current <
                        questions.length - 1
                    ) {


                        current++;


                        showQuestion();

                    }
                    else {


                        submitQuiz();

                    }

                }

            },
            1000
        );

}


/* =====================================================
   UPDATE TIMER
===================================================== */

function updateTimer() {


    const minutes =
        Math.floor(
            remaining / 60
        );


    const seconds =
        remaining % 60;


    const text =
        `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;


    $("timer")
        .textContent =
        text;


    $("questionTimer")
        .textContent =
        `⏱ ${text}`;


    $("timer")
        .classList
        .toggle(
            "danger",
            remaining <= 5
        );


    $("questionTimer")
        .classList
        .toggle(
            "danger",
            remaining <= 5
        );

}


/* =====================================================
   NEXT
===================================================== */

function moveNext() {


    /*
        Answer is NOT mandatory.

        Student can click Next
        without selecting anything.
    */

    if (
        current <
        questions.length - 1
    ) {


        current++;


        showQuestion();

    }
    else {


        submitQuiz();

    }

}


/* =====================================================
   NEXT / SUBMIT BUTTON
===================================================== */

$("next")
    .addEventListener(
        "click",
        () => {


            if (
                submitting
            ) {

                return;

            }


            if (
                current <
                questions.length - 1
            ) {


                moveNext();

            }
            else {


                submitQuiz();

            }

        }
    );


/* =====================================================
   SUBMIT QUIZ
===================================================== */


/* =====================================================
   TAB SWITCH ONLY
   Refresh / F5 must NOT submit.
   Another browser tab staying hidden DOES submit.
   ===================================================== */

/*
 * Refresh/reload/navigation fires beforeunload.
 * A normal tab switch does not.
 */
window.addEventListener(
    "beforeunload",
    function () {

        pageIsBeingReloaded = true;

        clearTimeout(
            tabSwitchTimer
        );

        tabSwitchTimer = null;

    }
);


function handleTabSwitch() {

    if (
        !started ||
        submitting ||
        tabSwitchSubmitted ||
        quizFinished ||
        pageIsBeingReloaded
    ) {
        return;
    }


    tabSwitchSubmitted = true;


    /*
     * Warning first.
     * Then submit automatically.
     */
    alert(
        "Warning: You switched to another tab. Your quiz will be submitted automatically."
    );


    submitQuiz(
        true
    );

}


/*
 * visibilitychange detects an actual browser-tab switch.
 */
document.addEventListener(
    "visibilitychange",
    function () {

        if (
            document.visibilityState !== "hidden"
        ) {

            clearTimeout(
                tabSwitchTimer
            );

            tabSwitchTimer = null;

            return;

        }


        if (
            !started ||
            submitting ||
            tabSwitchSubmitted ||
            quizFinished
        ) {

            return;

        }


        clearTimeout(
            tabSwitchTimer
        );


        /*
         * Give refresh/F5 time to fire beforeunload.
         * If beforeunload fires, pageIsBeingReloaded becomes true
         * and this callback will not submit.
         */
        tabSwitchTimer =
            setTimeout(
                function () {

                    if (
                        document.visibilityState === "hidden" &&
                        !pageIsBeingReloaded &&
                        started &&
                        !submitting &&
                        !tabSwitchSubmitted &&
                        !quizFinished
                    ) {

                        handleTabSwitch();

                    }

                },
                500
            );

    }
);


async function submitQuiz(autoSubmitted = false) {


    if (
        submitting
    ) {

        return;

    }


    submitting =
        true;


    clearInterval(
        timer
    );


    $("next").disabled =
        true;


    $("next")
        .textContent =
        "SUBMITTING...";


    /*
        Calculate total quiz time in seconds.

        From the moment the quiz starts
        until submit is triggered.

        This includes time spent on all questions.
    */

    if (quizStartTime !== null) {

        totalTimeTaken =
            Math.max(
                0,
                Math.floor(
                    (Date.now() - quizStartTime) / 1000
                )
            );

    }


    try {


        /*
            Send answers + TOTAL quiz time.
        

            Unanswered questions are not included.
        */

        await api(
            "/api/student/submit",
            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        quiz_id:
                            quiz.id,

                        answers:
                            answers,

                        /*
                            Total quiz duration in seconds.
                        */
                        total_time_taken:
                            totalTimeTaken

                    }),

                keepalive:
                    true

            }
        );


        /*
            IMPORTANT:

            Set started=false BEFORE our own
            exitFullscreen() call.

            Therefore fullscreenchange will
            NOT trigger a second submission.
        */

        started =
            false;

        quizFinished =
            true;


        /*
            Show completion screen.
        */

        $("completionScreen")
            .classList
            .add(
                "active"
            );


        document.body.style.overflow =
            "hidden";


    }
    catch (
        error
    ) {


        console.error(
            "SUBMIT ERROR:",
            error
        );


        submitting =
            false;


        $("next").disabled =
            false;


        $("next")
            .textContent =

            current ===
            questions.length - 1

                ? "SUBMIT QUIZ ✓"

                : "Next →";


        alert(
            error.message
        );

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value ?? "";


    return div.innerHTML;

}


/* =====================================================
   INITIALIZE
===================================================== */

init();


</script>



<script>
/* Logic Hunt visual question number */
(function () {
    const q = document.getElementById("questionText");
    const n = document.getElementById("questionNumber");

    function syncQuestionNumber() {
        if (!q || !n) return;
        const match = String(n.textContent || "").match(/(\d+)/);
        q.setAttribute("data-question-number", match ? match[1] : "1");
    }

    syncQuestionNumber();

    if (n) {
        new MutationObserver(syncQuestionNumber).observe(n, {
            childList: true,
            characterData: true,
            subtree: true
        });
    }
})();
</script>
